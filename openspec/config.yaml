schema: fdd

context: |
  Product: Portal de reservas de canchas de pádel para un club de barrio — socios ven disponibilidad y reservan turnos desde el celular
  Stack: TypeScript, React, Vite
  Testing: Vitest + Testing Library (component level by default)
  Run: npm run dev | Test: npx vitest run

  Expensive-to-reverse decisions:
  - Persistence: none yet (in-memory) — revisit when a story needs data to survive a reload
  - Auth, tenancy, public contracts: n/a for now

  Definition of Done:
  - demo: tests green + manual checks done with the user.
  - production: n/a for this trial.

rules:
  story:
    - Write user-facing text in Spanish.

operations:
  apply:
    guidance:
      - Run only the affected tests while red/green; the full suite before the Close section.
  archive:
    guidance:
      - Don't archive with open boxes in the Close section unless the user explicitly says so.